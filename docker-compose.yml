services:
  # ─────────────────────────────────────────────────────────
  # MongoDB Database Service
  # ─────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: brainfy-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    # Exposed on host port 27018 by default to prevent conflicts with local MongoDB
    ports:
      - "${MONGO_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - brainfy-network

  # ─────────────────────────────────────────────────────────
  # Express Backend API Service
  # ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brainfy-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/brainfy
      - JWT_SECRET=${JWT_SECRET:-brainfy_secure_production_secret_key_2026_xyz}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - brainfy-network

  # ─────────────────────────────────────────────────────────
  # React + Vite Frontend (Served by Nginx on port 3000)
  # ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: brainfy-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - brainfy-network

volumes:
  mongodb_data:
    driver: local

networks:
  brainfy-network:
    driver: bridge
